name: Build Propods Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/ci-windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/ci-windows.yml'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S windows -B windows/build -A x64  # newest installed Visual Studio

      - name: Build
        run: cmake --build windows/build --config Release --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: propods-windows
          path: windows/build/Release/*.exe
          if-no-files-found: warn
